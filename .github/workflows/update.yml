name: Update Credit Watch

on:
  schedule:
    - cron: '0 21 * * *'      # 21:00 UTC = 06:00 KST, every day
  workflow_dispatch:           # allows manual "Run workflow"
  push:                        # redeploy automatically whenever a file is edited on main
    branches: [main]
    paths-ignore:
      - 'data.json'            # (ignore the bot's own data commits)

permissions:
  contents: write              # needed so the bot can commit data.json back to main
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 fetch_fred.py

      # Daily commit = repository activity -> GitHub never auto-disables the schedule (60-day rule)
      - name: Commit data.json back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data.json
          git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)" || echo "no changes to commit"
          git push

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp data.json  _site/data.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
